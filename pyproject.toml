[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "LiveAI"
version = "0.0.2b1"
description = "Voice and screen-sharing chat for web chatbots"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "playwright>=1.62",
    "websockets>=15,<17",
    "PySide6-Essentials",
]

[project.optional-dependencies]
build = ["PyYAML==6.0.3", "packaging>=24,<27"]

[project.gui-scripts]
LiveAI = "live_gpt.app:main"
LiveGPT = "live_gpt.app:main"
live-gpt = "live_gpt.app:main"

[tool.setuptools.package-data]
live_gpt = ["assets/*.ico", "assets/*.png", "assets/*.svg"]

[tool.setuptools.data-files]
"share/live-gpt/pets/feibi-jiubi" = ["assets/pets/feibi-jiubi/pet.json", "assets/pets/feibi-jiubi/spritesheet.webp"]
