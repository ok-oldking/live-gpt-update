name: "LiveAI"
uac: false
icon: "src/live_gpt/assets/app-icon.png"
website: "https://github.com/ok-oldking/live-gpt/releases"

profiles:
  - name: "China"
    git_url: "https://cnb.cool/ok-oldking/live-gpt-update.git"
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    PYTHONPATH: "src"
    use_pythonw: true
    admin: false
    show_add_defender: false
    pip_args: "--no-deps --index-url https://mirrors.aliyun.com/pypi/simple"

  - name: "Global"
    git_url: "https://github.com/ok-oldking/live-gpt-update.git"
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    PYTHONPATH: "src"
    use_pythonw: true
    admin: false
    show_add_defender: false
    pip_args: "--no-deps --index-url https://pypi.org/simple"
